name: Build Hailo-8 Docker Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ghcr-images.yml"
      - "docker/hailo8/**"
      - "src/rpi5_hailo8_*/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model image to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - centerpose_regnetx_800mf
          - stdc1
          - centernet_resnet_v1_18_postprocess

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: seeed-projects/recomputer-hailo8-cv
  SOURCE_REPOSITORY: https://github.com/Seeed-Projects/reComputer-Hailo8-CV

jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: centerpose_regnetx_800mf
            description: CenterPose RegNetX-800MF pose estimation
          - model: stdc1
            description: STDC1 semantic segmentation
          - model: centernet_resnet_v1_18_postprocess
            description: CenterNet (resnet_v1_18) object detection

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select model
        id: selected
        shell: bash
        run: |
          build=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
              build=true
            fi
          else
            before_sha="${{ github.event.before }}"
            current_sha="${{ github.sha }}"

            if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              changed_files="$(git show --pretty=format: --name-only "$current_sha")"
            else
              changed_files="$(git diff --name-only "$before_sha" "$current_sha")"
            fi

            echo "Changed files:"
            echo "$changed_files"

            if echo "$changed_files" | grep -Fxq ".github/workflows/build-ghcr-images.yml"; then
              build=true
            elif echo "$changed_files" | grep -Eq "^src/rpi5_hailo8_${{ matrix.model }}/|^docker/hailo8/${{ matrix.model }}\\.dockerfile$"; then
              build=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build ${{ matrix.model }}: $build"

      - name: Set up QEMU
        if: steps.selected.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.selected.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.selected.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.selected.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.model }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.model }}
            org.opencontainers.image.description=${{ matrix.description }} for CM5 + Hailo-8
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}

      - name: Build and push
        if: steps.selected.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/rpi5_hailo8_${{ matrix.model }}
          file: ./docker/hailo8/${{ matrix.model }}.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.model }}
          cache-to: type=gha,mode=max,scope=${{ matrix.model }}
          provenance: false

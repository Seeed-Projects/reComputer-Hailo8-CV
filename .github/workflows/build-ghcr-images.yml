name: Build Hailo-8 Docker Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ghcr-images.yml"
      - "docker/hailo8/**"
      - "src/rpi5_hailo8_*/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model image to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - centerpose_regnetx_800mf
          - stdc1
          - centernet_resnet_v1_18_postprocess
          - centernet_resnet_v1_50_postprocess
          - damoyolo_tinynas_l20_t
          - damoyolo_tinynas_l25_s
          - damoyolo_tinynas_l35_m
          - efficientdet_lite0
          - efficientdet_lite1
          - efficientdet_lite2
          - nanodet_repvgg
          - nanodet_repvgg_a12
          - nanodet_repvgg_a1_640
          - ssd_mobilenet_v1
          - ssd_mobilenet_v2
          - tiny_yolov3
          - tiny_yolov4
          - vit_pose_small
          - vit_pose_small_bn
          - depth_anything_v2_vits
          - depth_anything_vits

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: seeed-projects/recomputer-hailo8-cv
  SOURCE_REPOSITORY: https://github.com/Seeed-Projects/reComputer-Hailo8-CV

jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: centerpose_regnetx_800mf
            description: CenterPose RegNetX-800MF pose estimation
          - model: stdc1
            description: STDC1 semantic segmentation
          - model: centernet_resnet_v1_18_postprocess
            description: CenterNet (resnet_v1_18) object detection
          - model: centernet_resnet_v1_50_postprocess
            description: CenterNet (resnet_v1_50) object detection
          - model: damoyolo_tinynas_l20_t
            description: DAMO-YOLO (tinynasL20_T) object detection
          - model: damoyolo_tinynas_l25_s
            description: DAMO-YOLO (tinynasL25_S) object detection
          - model: damoyolo_tinynas_l35_m
            description: DAMO-YOLO (tinynasL35_M) object detection
          - model: efficientdet_lite0
            description: EfficientDet-Lite0 object detection
          - model: efficientdet_lite1
            description: EfficientDet-Lite1 object detection
          - model: efficientdet_lite2
            description: EfficientDet-Lite2 object detection
          - model: nanodet_repvgg
            description: NanoDet-RepVGG object detection
          - model: nanodet_repvgg_a12
            description: NanoDet-RepVGG-a12 object detection
          - model: nanodet_repvgg_a1_640
            description: NanoDet-RepVGG-a1-640 object detection
          - model: ssd_mobilenet_v1
            description: SSD MobileNet V1 object detection
          - model: ssd_mobilenet_v2
            description: SSD MobileNet V2 object detection
          - model: tiny_yolov3
            description: Tiny-YOLOv3 object detection
          - model: tiny_yolov4
            description: Tiny-YOLOv4 object detection
          - model: vit_pose_small
            description: ViTPose-Small single-person pose estimation
          - model: vit_pose_small_bn
            description: ViTPose-Small-BN single-person pose estimation
          - model: depth_anything_v2_vits
            description: Depth-Anything-V2-ViTS depth estimation
          - model: depth_anything_vits
            description: Depth-Anything-ViTS depth estimation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select model
        id: selected
        shell: bash
        run: |
          build=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
              build=true
            fi
          else
            before_sha="${{ github.event.before }}"
            current_sha="${{ github.sha }}"

            if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              changed_files="$(git show --pretty=format: --name-only "$current_sha")"
            else
              changed_files="$(git diff --name-only "$before_sha" "$current_sha")"
            fi

            echo "Changed files:"
            echo "$changed_files"

            if echo "$changed_files" | grep -Fxq ".github/workflows/build-ghcr-images.yml"; then
              build=true
            elif echo "$changed_files" | grep -Eq "^src/rpi5_hailo8_${{ matrix.model }}/|^docker/hailo8/${{ matrix.model }}\\.dockerfile$"; then
              build=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build ${{ matrix.model }}: $build"

      - name: Set up QEMU
        if: steps.selected.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.selected.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.selected.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.selected.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.model }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.model }}
            org.opencontainers.image.description=${{ matrix.description }} for CM5 + Hailo-8
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}

      - name: Build and push
        if: steps.selected.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/rpi5_hailo8_${{ matrix.model }}
          file: ./docker/hailo8/${{ matrix.model }}.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.model }}
          cache-to: type=gha,mode=max,scope=${{ matrix.model }}
          provenance: false
